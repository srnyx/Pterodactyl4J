import org.apache.tools.ant.filters.ReplaceTokens

plugins {
	id 'signing'
	id 'java-library'
	id 'maven-publish'
	id 'com.gradleup.shadow' version "9.4.2"
	id 'com.diffplug.spotless' version '8.6.0'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(8)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.squareup.okhttp3:okhttp:3.13.0'
	implementation 'org.json:json:20220924'
	implementation 'org.slf4j:slf4j-api:1.7.32'
	implementation 'org.jetbrains:annotations:23.0.0'
}

javadoc {
	failOnError = false
	options {
		memberLevel = JavadocMemberLevel.PUBLIC
		encoding = "UTF-8"
		addStringOption('Xdoclint:none', '-quiet')
	}
	if (options instanceof StandardJavadocDocletOptions) {
		StandardJavadocDocletOptions opt = options
		opt.author()
		opt.tags("incubating:a:Incubating:")
	}

	exclude("com/mattmalec/pterodactyl4j/utils/Checks.java",
			"com/mattmalec/pterodactyl4j/utils/ExceptionUtils.java",
			"com/mattmalec/pterodactyl4j/utils/LockUtils.java",
			"com/mattmalec/pterodactyl4j/utils/NamedThreadFactory.java",

			"com/mattmalec/pterodactyl4j/entities/impl",
			"com/mattmalec/pterodactyl4j/application/entities/impl",
			"com/mattmalec/pterodactyl4j/client/entities/impl",

			"com/mattmalec/pterodactyl4j/client/ws/handle",
			"com/mattmalec/pterodactyl4j/client/ws/WebSocketClient.java",
			"com/mattmalec/pterodactyl4j/client/ws/WebSocketAction.java")
}

task sourcesForRelease(type: Copy) {
	from('src/main/java') {
		include '**/P4JInfo.java'
		filter(ReplaceTokens, tokens: [VERSION: version])
	}
	into 'build/filteredSrc'
	includeEmptyDirs = false
}

compileJava {
	source = sourceSets.main.java.filter {
		it.name != 'P4JInfo.java'
	} + files(sourcesForRelease)

	dependsOn sourcesForRelease
}

shadowJar.archiveClassifier.set('withDependencies')

task sourcesJar(type: Jar) {
	archiveClassifier.set('sources')
	from ('src/main/java') {
		exclude '**/P4JInfo.java'
	}
	from(tasks.sourcesForRelease)
	dependsOn sourcesForRelease
}

task javadocJar(type: Jar, dependsOn: javadoc) {
	archiveClassifier.set('javadoc')
	from(tasks.javadoc)
}

build {
	dependsOn javadocJar
	dependsOn sourcesJar
	dependsOn shadowJar

	jar.mustRunAfter clean
	shadowJar.mustRunAfter sourcesJar
}

sourceSets.main.java.srcDir(sourcesForRelease.destinationDir)

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
	options.incremental = true
	options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked"]
}

spotless {
	format 'misc', {
		target '*.gradle', '.gitignore'
		trimTrailingWhitespace()
		leadingSpacesToTabs()
		endWithNewline()
	}
	java {
		ratchetFrom 'origin/develop'

		target 'src/main/java/**/*.java'

		formatAnnotations()
		palantirJavaFormat()
		leadingSpacesToTabs()
		endWithNewline()

		licenseHeader '/*\n' +
				' *    Copyright $YEAR Matt Malec, and the Pterodactyl4J contributors\n' +
				' *\n' +
				' *    Licensed under the Apache License, Version 2.0 (the "License");\n' +
				' *    you may not use this file except in compliance with the License.\n' +
				' *    You may obtain a copy of the License at\n' +
				' *\n' +
				' *        http://www.apache.org/licenses/LICENSE-2.0\n' +
				' *\n' +
				' *    Unless required by applicable law or agreed to in writing, software\n' +
				' *    distributed under the License is distributed on an "AS IS" BASIS,\n' +
				' *    WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n' +
				' *    See the License for the specific language governing permissions and\n' +
				' *    limitations under the License.\n' +
				' */\n\n'

	}
}

class Version {
	String major, minor, patch

	String toString() {
		return "$major.${minor}.${patch}"
	}
}

// Handle VERSION environment variable
String mavenVersion = System.getenv('VERSION')
if (mavenVersion != null) version = mavenVersion

// Setup publishing
String mavenUrl = System.getenv("MAVEN_URL")
String mavenName = System.getenv("MAVEN_NAME")
String mavenSecret = System.getenv("MAVEN_SECRET")
publishing {
	publications {
		mavenJava(MavenPublication) {

			version = version
			artifactId = 'Pterodactyl4J'
			groupId = 'com.mattmalec'

			from components.java

			artifact sourcesJar
			artifact javadocJar

			pom {
				name = project.name
				description = 'Java wrapper for the API of Pterodactyl'
				url = 'https://github.com/srnyx/Pterodactyl4J'
				licenses {
					license {
						name = 'The Apache Software License, Version 2.0'
						url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
					}
				}
				developers {
					developer {
						id = 'mattmalec'
						name = 'Matt Malec'
						email = 'matt@mattmalec.com'
					}
					developer {
						id = 'srnyx'
						name = 'srnyx'
						email = 'contact@srnyx.com'
					}
				}
				scm {
					connection = 'scm:git:https://github.com/srnyx/Pterodactyl4J'
					developerConnection = 'scm:git:ssh://github.com/srnyx/Pterodactyl4J'
					url = 'https://github.com/srnyx/Pterodactyl4J'
				}
			}
		}
	}

	if (mavenUrl && mavenName && mavenSecret) {
		repositories {
			maven {
				url = uri(mavenUrl)
				credentials {
					username = mavenName
					password = mavenSecret
				}
			}
		}
	}
}
